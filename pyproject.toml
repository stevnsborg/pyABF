[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyABF"
version = "0.0.1"
authors = [
  { name="Mads Stevnsborg", email="madsstevnsborg@gmail.com" },
]
maintainers = [
  { name="Mads Stevnsborg", email="madsstevnsborg@gmail.com" },
]
description = "A python package for administering and calculating the value of an Andelsbolig and Andelsboligforening using the currently established methods as of 2025."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.2.3",
  "pandas==2.2.3",
]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Topic :: Real-Estate Analysis :: Data Aquisition Tools",
  "Environment :: Console",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
]

[project.urls]
Homepage = "https://github.com/stevnsborg/pyBBR"
Issues = "https://github.com/stevnsborg/pyBBR/issues"