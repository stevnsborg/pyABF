[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyABF"
version = "0.1.0"
authors = [
  { name="Mads Stevnsborg", email="madsstevnsborg@gmail.com" },
]
maintainers = [
  { name="Mads Stevnsborg", email="madsstevnsborg@gmail.com" },
]
description = "Værktøjer til beregning og modellering af økonomi i danske andelsboligforeninger."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/stevnsborg/pyABF"
Issues = "https://github.com/stevnsborg/pyABF/issues"

[tool.setuptools.packages.find]
where = ["src"]
